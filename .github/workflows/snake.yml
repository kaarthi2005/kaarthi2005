name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# ⚠️  IMPORTANT: Go to this repo's Settings → Actions → General →
#    Workflow permissions → select "Read and write permissions" → Save.
#    This is the REPO settings, not your account settings.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake — light mode
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kaarthi2005
          outputs: |
            dist/snake-light.svg?palette=github-light&color_dots=#10B981,#22D3EE,#0891B2,#A78BFA,#7C3AED&color_empty=#E2E8F0

      - name: Generate snake — dark mode
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kaarthi2005
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_dots=#10B981,#22D3EE,#0891B2,#A78BFA,#7C3AED&color_empty=#2d3343

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
